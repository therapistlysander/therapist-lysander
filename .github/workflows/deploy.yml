name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /home/kodeclouds-therapistlysander/htdocs/therapistlysander.kodeclouds.com

            echo "=== Pulling latest code ==="
            git stash
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/rakeshmaity271/therapistlysander.git
            git pull origin main
            git stash drop || true

            echo "=== Composer install ==="
            COMPOSER_ALLOW_SUPERUSER=1 composer install --optimize-autoloader --no-dev --no-interaction

            echo "=== NPM install + build ==="
            npm install --ignore-scripts
            npm run build

            echo "=== Rebuild caches ==="
            php artisan view:clear
            php artisan config:clear
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "=== Restart queue workers ==="
            php artisan queue:restart

            echo "=== Deployment complete ==="
