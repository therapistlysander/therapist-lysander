name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Contabo Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            # Pull latest code
            git pull origin main

            # Install Composer dependencies
            composer install --no-dev --optimize-autoloader --no-interaction

            # Install Node dependencies and build assets
            npm install --no-fund --no-audit
            npm run build

            # Run migrations
            php artisan migrate --force

            # Optimize Laravel
            php artisan optimize
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Fix permissions
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Restart queue workers
            php artisan queue:restart

            # Restart Supervisor workers (if available)
            supervisorctl reread || true
            supervisorctl update || true
            supervisorctl restart all || true

            echo "Deployment completed successfully!"
name: Deploy to Production

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /home/kodeclouds-therapistlysander/htdocs/therapistlysander.kodeclouds.com

            echo "=== Pulling latest code ==="
            git stash
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/rakeshmaity271/therapistlysander.git
            git pull origin dev
            git stash drop || true

            echo "=== Composer install ==="
            COMPOSER_ALLOW_SUPERUSER=1 composer install --optimize-autoloader --no-dev --no-interaction

            echo "=== NPM install + build ==="
            npm install --ignore-scripts
            npm run build

            echo "=== Run migrations ==="
            php artisan migrate --force

            echo "=== Rebuild caches ==="
            php artisan optimize:clear
            php artisan view:clear
            php artisan config:clear
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan event:cache
            php -r "if(function_exists('opcache_reset')){opcache_reset();echo 'OPcache cleared';} else {echo 'OPcache not available';}"

            echo "=== Restart queue workers ==="
            php artisan queue:restart

            echo "=== Deployment complete ==="
